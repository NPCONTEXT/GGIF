name: Windows 测试
# 手动触发时在 GitHub 的 Windows 机器上跑：取固定的随包程序（发布 deps-win-1 里的 win-vendor.zip）→ 引擎测试 → 编小助手 → app 单测
# → 打包（electron-builder：安装包 + 免安装 zip）→ 冒烟（静默装上、真压一段、截图、扫 Mac 字样）→ 上传产物。
# 手动触发勾「放进发布」时，把安装包和 zip 放进一个预发布，给真机试（Windows版 W8、W10）。
# 云端没有私人素材（样本只在本机，不推）：要私人素材的测试标「跳过」并写原因，只在本机跑。
# 手动触发时可以勾「连慢测试一起跑」。
on:
  workflow_dispatch:
    inputs:
      slow:
        description: 连慢测试一起跑
        type: boolean
        default: false
      publish:
        description: 放进发布（出给真机试的包）
        type: boolean
        default: false
      release_tag:
        description: 放进已有的哪个发布（填它的标签，比如 v0.6.0；留空就照旧另建一个预发布）
        type: string
        default: ''
permissions:
  contents: write
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GIFKIT_NO_PRIVATE_SAMPLES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 取 Windows 随包程序
        shell: pwsh
        run: |
          gh release download deps-win-1 -R $env:GITHUB_REPOSITORY -p win-vendor.zip
          Expand-Archive win-vendor.zip -DestinationPath engine/vendor
          Copy-Item third_party/gifski-LICENSE engine/vendor/licenses/gifski-LICENSE
          Get-ChildItem engine/vendor | Format-Table Name, Length
      - name: 引擎测试
        working-directory: engine
        shell: pwsh
        env:
          GIFKIT_SLOW: ${{ inputs.slow && '1' || '0' }}
        run: node --test --test-reporter=spec "test/*.test.js"
      - name: 编 Windows 小助手（native/win/ggif-helper.c：投放块要知道前台是不是全屏程序）
        if: ${{ !cancelled() }}
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          if not exist app\native\bin mkdir app\native\bin
          cl /nologo /O2 /W3 /utf-8 app\native\win\ggif-helper.c /Fe:app\native\bin\ggif-helper.exe /Fo:%TEMP%\ /link shell32.lib || exit /b 1
      - name: app 单测
        if: ${{ !cancelled() }}
        working-directory: app
        shell: pwsh
        run: node --test --test-reporter=spec "test/*.test.js"
      - name: 打包（安装包 + 免安装 zip）
        if: ${{ !cancelled() }}
        working-directory: app
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npx --yes electron-builder@26.18.1 --win --x64 --config electron-builder.win.json --publish never
          Get-ChildItem dist-win -File | Format-Table Name, Length
      - name: 冒烟（静默装上、真压一段中文路径的视频、截图、扫 Mac 字样）
        shell: pwsh
        run: |
          $ver = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $setup = "app/dist-win/GGIF-$ver-Setup.exe"
          $t0 = Get-Date
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          # 一键、按用户装时文件夹名用 package.json 的 name（gifkit-app），不是产品名：在 Programs 下面找 GGIF.exe
          $progs = Join-Path $env:LOCALAPPDATA 'Programs'
          $exe = Get-ChildItem $progs -Recurse -Filter GGIF.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { Get-ChildItem $progs -ErrorAction SilentlyContinue | Format-Table Name; throw "没装上：$progs 下找不到 GGIF.exe" }
          "装好了，用了 $([int]((Get-Date) - $t0).TotalSeconds) 秒：$exe"
          $dir = Split-Path (Split-Path $exe -Parent) -Leaf
          if ($dir -ne 'ggif') { throw "安装文件夹叫 $dir，不是 ggif" }
          $src = Join-Path $env:RUNNER_TEMP '冒烟 素材'
          New-Item -ItemType Directory -Force $src | Out-Null
          $video = Join-Path $src '测试 视频.mp4'
          ./engine/vendor/ffmpeg.exe -hide_banner -v error -y -f lavfi -i testsrc2=size=1280x720:rate=30 -t 3 -pix_fmt yuv420p -c:v libx264 $video
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $out | Out-Null
          # 安装程序装完会不会自己把 GGIF 打开（那样冒烟这次就成了第二个 GGIF）：看一眼、有就关掉
          $pre = @(Get-Process GGIF -ErrorAction SilentlyContinue)
          "装完已经在跑的 GGIF：$($pre.Count) 个"
          $pre | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $env:GIFKIT_TRAY_DROP = $video
          $env:GIFKIT_SMOKE_DIR = $out
          # 按 150% 缩放跑（笔记本常见；作者的投放块长条就是在缩放不是 100% 时）
          $p = Start-Process -FilePath $exe -ArgumentList '--force-device-scale-factor=1.5' -PassThru -RedirectStandardOutput (Join-Path $out 'stdout.txt') -RedirectStandardError (Join-Path $out 'stderr.txt')
          $ok = $p.WaitForExit(240000)
          '--- GGIF 的输出 ---'
          Get-Content (Join-Path $out 'stdout.txt') -ErrorAction SilentlyContinue | Select-Object -Last 60
          '--- GGIF 的报错 ---'
          Get-Content (Join-Path $out 'stderr.txt') -ErrorAction SilentlyContinue | Select-Object -Last 30
          '--- GGIF 的操作日志 ---'
          Get-ChildItem (Join-Path $env:APPDATA 'GGIF\logs') -File -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName | Select-Object -Last 40 }
          '--- 冒烟文件夹 ---'
          Get-ChildItem $out -ErrorAction SilentlyContinue | Format-Table Name, Length
          if (-not $ok) { Get-Process GGIF -ErrorAction SilentlyContinue | Stop-Process -Force; throw '冒烟超过 4 分钟没退' }
          $j = Get-Content (Join-Path $out 'smoke.json') -Raw | ConvertFrom-Json
          Get-Content (Join-Path $out 'smoke.json') -Raw
          if ($j.error) { throw "冒烟出错：$($j.error)" }
          $done = @($j.list | ForEach-Object { $_.chips } | Where-Object { $_.state -eq 'done' -and $_.bytes -gt 0 -and $_.bytes -le 9900000 })
          if ($done.Count -lt 1) { throw '列表里没有压好的结果' }
          $mac = @($j.macWords.PSObject.Properties | Where-Object { $_.Value.Count -gt 0 })
          if ($mac.Count -gt 0) { throw "页面里还有 Mac 的说法：$(($mac | ForEach-Object { $_.Name + '=' + ($_.Value -join ',') }) -join '；')" }
          foreach ($n in '面板', '主界面', '设置', '托盘提示', '面板_张嘴', '小条', '投放块_平时', '投放块_拖过来') { if ($j.shots -notcontains $n) { throw "少了截图：$n" } }
          if (-not $j.dropBlock.visible) { throw '投放块没显示（强制显示也不行）' }
          "投放块：截图前显示着 $($j.dropBlock.visibleBefore)，小助手报的全屏 $($j.dropBlock.dropFull)"
          if (-not $j.fullWatch) { throw 'Windows 小助手没起来（投放块全屏时不会藏）' }
          "投放块拖着挪 300 次（缩放 $($j.dropDrag.scale)）：新写法 $($j.dropDrag.afterSetBounds.width)×$($j.dropDrag.afterSetBounds.height)；对照只用 setPosition $($j.dropDrag.afterSetPosition.width)×$($j.dropDrag.afterSetPosition.height)"
          # 150% 缩放下换算取整会多 1 点（35×65），要看的是挪了 300 次没长大：和挪之前比，误差不超过 1 点
          $d = $j.dropDrag
          if ([math]::Abs($d.afterSetBounds.width - $d.start.width) -gt 1 -or [math]::Abs($d.afterSetBounds.height - $d.start.height) -gt 1 -or [math]::Abs($d.afterSetBounds.width - 34) -gt 1 -or [math]::Abs($d.afterSetBounds.height - 64) -gt 1) { throw "投放块拖着挪以后大小变了：挪前 $($d.start.width)×$($d.start.height)，挪后 $($d.afterSetBounds.width)×$($d.afterSetBounds.height)" }
          $t = $j.trayDrag
          "拖进托盘：提示小窗 $($t.hintShown)，面板弹出 $($t.panelOpened)，嘴张开 $($t.mouthOpen)，提示收起 $($t.hintHidden)，取消后收回 $($t.closedAfterCancel)"
          if (-not ($t.hintShown -and $t.panelOpened -and $t.mouthOpen -and $t.hintHidden -and $t.closedAfterCancel)) { throw '拖进托盘的两段式不对' }
          "双击小条：$($j.bubble.bounds.width)×$($j.bubble.bounds.height)，临时开可调大小 $($j.bubble.resizeFix)"
          if (-not $j.bubble.visible -or $j.bubble.bounds.height -gt 300) { throw "双击小条没按内容收小：高 $($j.bubble.bounds.height)" }
          if ($j.pin.unpinnedHides) { if (-not $j.pin.pinnedStaysVisible) { throw '固定开着时面板还是收了' } else { '固定：开着不收、关着收，都对' } } else { '固定：云端点别的窗口没触发失焦，这项没测到（要真机看）' }
          "冒烟过了：压好 $($done.Count) 个，最大 $([math]::Round(($done | Measure-Object bytes -Maximum).Maximum / 1e6, 2)) MB；截图 $($j.shots.Count) 张；Mac 字样 0 处"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: GGIF-windows
          path: |
            app/dist-win/*.exe
            app/dist-win/*.zip
            ${{ runner.temp }}/smoke/
          retention-days: 1
      - name: 放进发布（手动触发且勾了「放进发布」才做）
        if: ${{ success() && inputs.publish }}
        shell: pwsh
        env:
          REL_TAG: ${{ inputs.release_tag }}
        run: |
          $ver = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          if ($env:REL_TAG) {
            gh release upload $env:REL_TAG -R $env:GITHUB_REPOSITORY "app/dist-win/GGIF-$ver-Setup.exe" "app/dist-win/GGIF-$ver-win-x64.zip" --clobber
            exit $LASTEXITCODE
          }
          $tag = "win-v$ver-build$env:GITHUB_RUN_NUMBER"
          gh release create $tag -R $env:GITHUB_REPOSITORY --prerelease --target $env:GITHUB_SHA --title "GGIF Windows $ver（第 $env:GITHUB_RUN_NUMBER 次构建）" --notes "Windows 一期（压缩版）试用包。没有签名：Windows 会弹「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」。GGIF-$ver-Setup.exe 是安装包（装到自己的用户目录，不要管理员）；zip 是免安装版，解开双击 GGIF.exe。" "app/dist-win/GGIF-$ver-Setup.exe" "app/dist-win/GGIF-$ver-win-x64.zip"
